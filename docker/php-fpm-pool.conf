; Loaded after www.conf. Defaults come from the image ENV and can be overridden in .env.
; Each worker uses roughly 30-60 MB; keep FPM_MAX_CHILDREN x 60 MB well under the VPS's free RAM.
[www]
pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = ${FPM_START_SERVERS}
pm.min_spare_servers = ${FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${FPM_MAX_SPARE_SERVERS}
pm.max_requests = 500
request_terminate_timeout = 120s
